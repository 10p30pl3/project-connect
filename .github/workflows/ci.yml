name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voll_connect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/voll_connect_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/voll_connect_test
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contrato Voll Plan <-> gateway de voz atualizado
        run: npm run contracts:check -w @voll/shared
      - run: npm run typecheck
      - name: Testes (API/motor + contrato + gateway de voz)
        run: npm test
      - run: npm run build
      - name: Bundle do gateway de voz
        run: npm run build -w @voll/voice-gateway
