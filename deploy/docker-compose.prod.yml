# Voll Plan em produção (portal web + API + worker + PostgreSQL).
# Motor de voz (FreeSWITCH + OpenAI/ElevenLabs) roda no servidor local conectado via túnel reverso (`VOICE_APP_BASE_URL`).
# Uso: ./deploy/deploy.sh   (gera deploy/.env.production, constrói, migra e sobe)
name: voll-plan

x-api: &api
  build:
    context: ..
    dockerfile: deploy/api.Dockerfile
  image: voll-plan/api:latest
  restart: unless-stopped
  env_file: .env.production
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://voll:${POSTGRES_PASSWORD}@db:5432/voll_plan
    API_PORT: "3333"
  extra_hosts:
    # o gateway de voz roda na rede do host
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: voll_plan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voll -d voll_plan"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *api
    command: ["node", "dist/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *api
    command: ["node", "dist/worker.js"]

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: voll-plan/web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
